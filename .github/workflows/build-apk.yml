name: Build Gears 3 POCO F6 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      XPORT_GAME: gears_of_war_3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add 8GB swap space to prevent linker OOM
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK, NDK 27.2 & Build Tools 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.31.6'

      - name: Install build dependencies, Wine & gdown
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            ninja-build clang lld unzip curl zstd python3 python3-pip wine wine32:i386
          pip3 install --break-system-packages gdown capstone pefile || pip3 install gdown capstone pefile
          printf '#!/usr/bin/env bash\n[ "$1" = "-3" ] && shift\nexec python3 "$@"\n' | sudo tee /usr/local/bin/py >/dev/null
          sudo chmod +x /usr/local/bin/py

      - name: Download default.xex from secret
        env:
          XEX_URL: ${{ secrets.XEX_DOWNLOAD_URL }}
        run: |
          mkdir -p work_xex
          gdown "$XEX_URL" -O work_xex/download.bin
          if unzip -t work_xex/download.bin >/dev/null 2>&1; then
            unzip -o work_xex/download.bin -d work_xex/
          else
            mv work_xex/download.bin work_xex/default.xex
          fi
          XEX_FILE=$(find work_xex -iname "default.xex" | head -n 1)
          XEXP_FILE=$(find work_xex -iname "default.xexp" | head -n 1)
          XEXTOOL_EXE=$(find work_xex -iname "xextool.exe" | head -n 1)
          [ "$XEX_FILE" != "work_xex/default.xex" ] && cp "$XEX_FILE" work_xex/default.xex || true
          if [ -n "$XEXP_FILE" ] && [ -n "$XEXTOOL_EXE" ]; then
            WINEDEBUG=-all wine "$XEXTOOL_EXE" -e u -c u -o work_xex/default_patched.xex -p "$XEXP_FILE" work_xex/default.xex
            mv work_xex/default_patched.xex work_xex/default.xex
          fi

      - name: Build host tools (XenonRecomp, XenonAnalyse)
        run: |
          mkdir -p bin
          cmake -S third_party/XenonRecomp -B build-xenonrecomp -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build build-xenonrecomp -j $(nproc)
          cp build-xenonrecomp/XenonRecomp/XenonRecomp bin/XenonRecomp.exe
          cp build-xenonrecomp/XenonAnalyse/XenonAnalyse bin/XenonAnalyse.exe
          STATIC_LIBS=$(find build-xenonrecomp -name "*.a")
          clang++ -O2 -std=c++20 -Ithird_party/XenonRecomp/XenonUtils -Ithird_party/XenonRecomp/third_party/disasm -Ithird_party/XenonRecomp/third_party/fmt/include tools/xexinfo/xexinfo.cpp -Wl,--start-group $STATIC_LIBS -Wl,--end-group -o bin/xexinfo.exe
          chmod +x bin/*.exe

      - name: Recompile XEX via xport.py and generate shader cache stubs
        run: |
          python3 -I tools/xport.py work_xex/default.xex work_port
          mkdir -p games/gears_of_war_3/ppc games/gears_of_war_3/data/shader
          cp -r work_port/ppc/* games/gears_of_war_3/ppc/
          if [ ! -f games/gears_of_war_3/data/shader/shader_cache.cpp ]; then
          zstd -c < /dev/null > empty.zst
          python3 -c '
          zst = open("empty.zst", "rb").read()
          arr = ", ".join(f"0x{b:02x}" for b in zst)
          open("games/gears_of_war_3/data/shader/shader_cache.h", "w").write(f"""#pragma once
          #include <cstdint>
          #include <cstddef>
          #include <array>
          #include <string_view>
          struct FilenameBuf {{
              std::array<char, 256> buf{{}};
              constexpr FilenameBuf() = default;
              constexpr FilenameBuf(std::nullptr_t) {{}}
              constexpr FilenameBuf(const char*) {{}}
              operator char*() {{ return buf.data(); }}
              operator const char*() const {{ return buf.data(); }}
          }};
          inline std::string_view format_as(const FilenameBuf& f) {{ return f.buf.data(); }}
          struct ShaderCacheEntry {{
              uint64_t hash; uint32_t f1; uint32_t spirvOffset; uint32_t spirvSize;
              uint32_t lateSpirvOffset; uint32_t lateSpirvSize; uint32_t usedTextureMask;
              uint32_t f7; uint32_t f8; uint32_t specConstantsMask; uint32_t f10;
              FilenameBuf filename; uint32_t f12;
          }};
          inline constexpr uint8_t g_compressedSpirvCache[] = {{ {arr} }};
          inline constexpr size_t g_spirvCacheCompressedSize = {len(zst)};
          inline constexpr size_t g_spirvCacheDecompressedSize = 0;
          inline constexpr ShaderCacheEntry g_shaderCacheEntries[] = {{}};
          inline constexpr size_t g_shaderCacheEntryCount = 0;
          """)
          open("games/gears_of_war_3/data/shader/shader_cache.cpp", "w").write("#include \"shader_cache.h\"\n")
          '
          fi

      - name: Adapt build scripts for Linux runner
        run: |
          chmod +x tools/*.sh
          sed -i 's/pwd -W/pwd/g' tools/build-android.sh tools/build-apk.sh
          sed -i 's/\.bat//g' tools/build-apk.sh
          sed -i 's/\.exe//g' tools/build-apk.sh
          sed -i 's/windows-x86_64/linux-x86_64/g' tools/build-apk.sh
          sed -i 's/cmake -G Ninja/cmake -G Ninja -DCMAKE_MAKE_PROGRAM=ninja/g' tools/build-android.sh

      - name: Build native Android libraries (POCO F6 Cortex-X4)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: |
          export PATH="$ANDROID_HOME/cmake/3.31.6/bin:$PATH"
          ./tools/build-android.sh xport xportapp

      - name: Build libdxcompiler.so
      env:
        ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
      run: |
        mkdir -p build/dxc/dl build/dxc/src/external/DirectX-Headers build/dxc/src/external/SPIRV-Headers build/dxc/src/external/SPIRV-Tools
        G="https://github.com"
        curl -sL "$G/microsoft/DirectXShaderCompiler/tar.gz/refs/tags/v1.8.2407" | tar -xz -C build/dxc/src --strip-components=1
        curl -sL "$G/microsoft/DirectX-Headers/tar.gz/980971e835876dc0cde415e8f9bc646e64667bf7" | tar -xz -C build/dxc/src/external/DirectX-Headers --strip-components=1
        curl -sL "$G/KhronosGroup/SPIRV-Headers/tar.gz/2acb319af38d43be3ea76bfabf3998e5281d8d12" | tar -xz -C build/dxc/src/external/SPIRV-Headers --strip-components=1
        curl -sL "$G/KhronosGroup/SPIRV-Tools/tar.gz/0cfe9e7219148716dfd30b37f4d21753f098707a" | tar -xz -C build/dxc/src/external/SPIRV-Tools --strip-components=1
        sed -i 's/if(CMAKE_CROSSCOMPILING OR/if((CMAKE_CROSSCOMPILING AND NOT LLVM_TABLEGEN) OR/' build/dxc/src/CMakeLists.txt
        C="-GNinja -DCMAKE_BUILD_TYPE=Release -DLLVM_TARGETS_TO_BUILD=None -DLLVM_INCLUDE_DOCS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_TOOLS=OFF -DLLVM_ENABLE_BINDINGS=OFF -DLLVM_ENABLE_WARNINGS=OFF -DLLVM_OPTIMIZED_TABLEGEN=OFF -DENABLE_SPIRV_CODEGEN=ON -DHLSL_INCLUDE_TESTS=OFF"
        cmake -S build/dxc/src -B build/dxc/host $C -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DENABLE_SPIRV_CODEGEN=OFF && ninja -C build/dxc/host llvm-tblgen clang-tblgen
        cmake -S build/dxc/src -B build/dxc/android $C -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_static -DLLVM_INFERRED_HOST_TRIPLE=aarch64-unknown-linux-android -DLLVM_TABLEGEN="$PWD/build/dxc/host/bin/llvm-tblgen" -DCLANG_TABLEGEN="$PWD/build/dxc/host/bin/clang-tblgen"
        ninja -C build/dxc/android dxcompiler && "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" -o build/dxc/libdxcompiler.so build/dxc/android/lib/libdxcompiler.so

    - name: Package and sign APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          export USERPROFILE="$HOME"
          mkdir -p "$HOME/.android"
          echo "${{ secrets.FIXED_KEYSTORE_B64 }}" | base64 -d > "$HOME/.android/debug.keystore"
          mkdir -p build/dxc && cp vendor_dxc/libdxcompiler.so build/dxc/libdxcompiler.so || true; ./tools/build-apk.sh

      - name: Upload Optimized Gears 3 APK
        uses: actions/upload-artifact@v4
        with:
          name: GearsOfWar3-POCO-F6-Optimized
          path: build/**/*.apk
